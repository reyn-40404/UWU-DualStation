name: Build UWU APK

on:
  push:
    branches: [main, feature/uwu-v0.4-libvlc]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "找不到專案 ZIP"
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source
          WRAPPER=$(find source -name gradlew -type f -print -quit)
          if [ -z "$WRAPPER" ]; then
            echo "ZIP 裡找不到 gradlew"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Apply UWU v0.4 local player and media library
        run: |
          cp "$GITHUB_WORKSPACE/uwu-overlay/MediaLibraryDialog.kt" "$PROJECT_DIR/app/src/main/java/com/uwu/dualstation/ui/MediaLibraryDialog.kt"
          cp "$GITHUB_WORKSPACE/uwu-overlay/LocalPlayerActivity.kt" "$PROJECT_DIR/app/src/main/java/com/uwu/dualstation/LocalPlayerActivity.kt"
          python3 "$GITHUB_WORKSPACE/uwu-overlay/patch.py" "$PROJECT_DIR"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: UWU-APK-v0.4
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
