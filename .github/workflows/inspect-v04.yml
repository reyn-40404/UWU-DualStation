name: Inspect UWU source for v0.4
on:
  push:
    branches: [feature/uwu-v0.4-libvlc]
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and inspect project
        shell: bash
        run: |
          set -e
          mkdir source
          unzip -q UWU-DualStation-GitHub-Build.zip -d source
          WRAPPER=$(find source -name gradlew -type f -print -quit)
          PROJECT_DIR=$(dirname "$WRAPPER")
          echo "PROJECT_DIR=$PROJECT_DIR"
          echo "=== FILE TREE ==="
          find "$PROJECT_DIR/app/src/main" -maxdepth 7 -type f | sort
          echo "=== SETTINGS ==="
          cat "$PROJECT_DIR/settings.gradle.kts" 2>/dev/null || cat "$PROJECT_DIR/settings.gradle"
          echo "=== APP GRADLE ==="
          cat "$PROJECT_DIR/app/build.gradle.kts"
          echo "=== MANIFEST ==="
          cat "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "=== HOME SCREEN ==="
          sed -n '1,320p' "$PROJECT_DIR/app/src/main/java/com/uwu/dualstation/ui/HomeScreen.kt"
          echo "=== MAIN ACTIVITY FILES ==="
          find "$PROJECT_DIR/app/src/main/java" -iname '*activity*' -o -iname '*navigation*' | while read f; do echo "--- $f"; sed -n '1,240p' "$f"; done
